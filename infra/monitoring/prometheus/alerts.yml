# Prometheus alerting rules for RWA DataRoom
# Thresholds from system-architecture.md section 16.4
groups:
  - name: rwa_api
    rules:
      # API error rate > 1% over 5 minutes
      - alert: HighAPIErrorRate
        expr: |
          (
            sum(rate(http_requests_total{job="rwa-api", status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="rwa-api"}[5m]))
          ) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "API error rate exceeds 1%"
          description: "API 5xx error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      # API p99 latency > 2 seconds
      - alert: HighAPILatency
        expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job="rwa-api"}[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API p99 latency exceeds 2s"
          description: "API p99 latency is {{ $value }}s over the last 5 minutes."

  - name: rwa_indexer
    rules:
      # Indexer lag > 30 seconds behind chain head
      - alert: IndexerLag
        expr: indexer_chain_head_timestamp - indexer_last_processed_timestamp > 30
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Indexer is lagging behind chain head"
          description: "Indexer is {{ $value }}s behind the Sui chain head."

      # Indexer not processing events
      - alert: IndexerStalled
        expr: rate(indexer_events_processed_total[5m]) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Indexer has stopped processing events"
          description: "No events processed in the last 10 minutes."

  - name: rwa_walrus
    rules:
      # Walrus renewal failures after retries
      - alert: WalrusRenewalFailure
        expr: walrus_renewal_failures_total > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Walrus blob renewal failed"
          description: "{{ $value }} blob renewal(s) failed after 5 retries."

  - name: rwa_sui
    rules:
      # SUI reserve balance below 30-day projected spend
      - alert: LowSUIReserve
        expr: sui_sponsor_balance_mist < (sui_daily_gas_spend_mist * 30)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "SUI sponsor balance is low"
          description: "Current balance covers less than 30 days of projected gas spend."

  - name: rwa_infrastructure
    rules:
      # PostgreSQL connection pool > 80% utilisation
      - alert: HighPGConnectionUsage
        expr: pg_stat_activity_count / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection pool above 80%"
          description: "{{ $value | humanizePercentage }} of max connections are in use."

      # Redis memory > 80% capacity
      - alert: HighRedisMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage above 80%"
          description: "Redis is using {{ $value | humanizePercentage }} of max memory."
